# Netlify publishes only the web folder (the screens). Server code and rules
# in this repo go to Firebase instead and are never published by Netlify.
[build]
  publish = "web"

# The offline helper must always be checked fresh, or phones could keep an old version for a long time.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Tell phones this is the app manifest (Netlify doesn't know the .webmanifest type on its own).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
