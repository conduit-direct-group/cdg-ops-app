<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>CDG Operations</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CDG Ops">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <img class="brand-logo" src="icons/logo-banner.png" alt="Conduit Direct Group" width="137" height="40">
      <span class="brand-accent">Operations</span>
    </span>
    <span id="device-badge" class="badge" hidden>Line tablet</span>
  </header>
  <div id="test-banner" class="test-banner" role="status" hidden>TEST MODE — practice only. Nothing here reaches Odoo or the live app.</div>
  <div id="offline-banner" class="offline-banner" role="status" hidden>📡 Offline — you can look things up; saving waits until you're back online</div>
  <main id="screen" aria-live="polite" data-width="narrow">
    <div class="loading-screen"><div class="spinner-row" role="status"><span class="spinner" aria-hidden="true"></span>Loading…</div></div>
  </main>
  <nav id="app-nav" class="app-nav" aria-label="Main" hidden></nav>
  <noscript><p class="hint">This app needs JavaScript turned on.</p></noscript>
</body>
</html>
